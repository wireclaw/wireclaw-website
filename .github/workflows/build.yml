name: Build and Push Docker Image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'box'
      - 'beta'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tag
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"

          if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FINAL_IMAGE_TAG="${TAG_NAME}"
          elif [[ "$TAG_NAME" == "box" ]]; then
            FINAL_IMAGE_TAG="${GITHUB_SHA}"
          elif [[ "$TAG_NAME" == "beta" ]]; then
            FINAL_IMAGE_TAG="beta-${GITHUB_SHA}"
          fi

          TAGS="${IMAGE_NAME}:${FINAL_IMAGE_TAG}"
          if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS=$(printf "%s\n%s" "$TAGS" "${IMAGE_NAME}:latest")
          fi

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$FINAL_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
