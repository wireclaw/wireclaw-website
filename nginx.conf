server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static site — Astro generates an HTML file for every route.
    # e.g. /docs/getting-started → /docs/getting-started/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;

    # Immutable hashed assets from Astro (_astro/ directory)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static assets with long cache
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
